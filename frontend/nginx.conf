server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for text-based responses
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Tăng lên 50M để thoải mái upload ảnh/video phân tích
    client_max_body_size 50M;

    # Google OAuth callback: trả frontend (React xử lý code rồi POST lên backend)
    location = /auth/google/callback {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SPA pages — smart routing: browser navigation → SPA, API calls → backend
    # Detect via: non-GET methods OR Authorization header (admin API)
    location = /flash-sale {
        set $target spa;
        if ($request_method != GET) {
            set $target api;
        }
        if ($http_authorization) {
            set $target api;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($target = api) {
            proxy_pass http://backend:8080;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /vouchers {
        set $target spa;
        if ($request_method != GET) {
            set $target api;
        }
        if ($http_authorization) {
            set $target api;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($target = api) {
            proxy_pass http://backend:8080;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cacheable read-only APIs (categories rarely change, products change moderately)
    location = /categories {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=60";
    }

    # API proxy - không cache để dữ liệu mới (sản phẩm, đơn hàng...) hiển thị ngay
    location ~ ^/(auth|products|categories|storage|orders|carts|chat|users|roles|permissions|ai|ai-chat|actuator|reviews|vouchers|flash-sale|payments)(/|$) {
        proxy_pass http://backend:8080;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        
        # Header chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng thời gian chờ lên 300s (5 phút) 
        # Để tránh lỗi 504 Gateway Timeout khi AI phân tích dữ liệu lớn
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # FastAPI chatbot proxy (new chatbot runtime)
    location /fastapi-ai-chat/ {
        proxy_pass http://fastapi-chatbot:8091/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Giữ kết nối WebSocket lâu dài (24h)
        proxy_read_timeout 86400;
    }

    # Frontend SPA - index.html không cache để luôn load phiên bản mới
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}